\uc8fc\uc694\uc0ac\uc5c5\uc18c\uac1c\ub0b4\uc6a9=<div class="con_box">&quot;SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5&quot;\uc740 \uad6d\ub0b4 \uc911\uc18c\u2027\ucc3d\uc5c5 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uae30\uc5c5\uc774 \uac1c\ubc1c\ud55c \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c &quot;SW\ud504\ub85c\uc288\uba38&quot;\ub97c \ud1b5\ud574 \uc9c1\uc811 \uc0ac\uc6a9\ud574\ubcf4\uace0 \ud3c9\uac00\ud558\uc5ec, \ube60\ub978 \uae30\uc220 \ubcc0\ud654\uc640 \ud601\uc2e0\uc774 \uc694\uad6c\ub418\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ubd84\uc57c\uc5d0\uc11c \uc911\uc18c\u2027\ucc3d\uc5c5\uc774 \uc18c\ube44\uc790 \ubc18\uc751\uc744 \ud1a0\ub300\ub85c \ud65c\ubc1c\ud55c \uac1c\uc120 \uc791\uc744 \ud1b5\ud574 \uc2dc\uc7a5\uc5d0 \uc131\uacf5\uc801\uc73c\ub85c \uc548\ucc29\ud560 \uc218 \uc788\ub3c4\ub85d \ub3d5\uae30 \uc704\ud55c \uc0ac\uc5c5\uc785\ub2c8\ub2e4.</div><p class="con_img"><img src="/images/contents01.gif" alt="\uc81c\ud488\uacbd\uc7c1\ub825 \ud655\ubcf4" /></p><h4>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0</h4><h5>\uad6d\ub0b4 \uc911\uc18c\u2027\ucc3d\uc5c5 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uae30\uc5c5\uc758 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \u2018SW\ud504\ub85c\uc288\uba38\u2019\ub77c\uace0 \ud558\ub294 \uc0ac\uc6a9\uc790\uac00 \uc9c1\uc811 \uc0ac\uc6a9\ud558\uace0 \ud3c9\uac00\ud558\uc5ec, \uadf8 \uacb0\uacfc\ub97c \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uac1c\ubc1c \uae30\uc5c5\uc774 \uc81c\ud488\uc5d0 \ubc18\uc601\ud560 \uc218 \uc788\ub3c4\ub85d \uc9c0\uc6d0\ud569\ub2c8\ub2e4.</h5><p class="h5_txt">- SW\ud504\ub85c\uc288\uba38 : \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \ud765\ubbf8\ub97c \uac00\uc9c4 \uc18c\ube44\uc790\ub85c\uc11c, \uc801\uadf9\uc801\uc778 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc0ac\uc6a9\uacfc \uc758\uacac \uc81c\uc2dc\ub97c \ud1b5\ud574 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc0dd\uc0b0\uacfc \uc18c\ube44\ub97c \ub3d9\uc2dc\uc5d0 \ud558\ub294 \uc18c\ube44\uc790</p><h5>\ub300\uc0c1 : \uad6d\ub0b4 \uc911\uc18c\u2027\ucc3d\uc5c5 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uae30\uc5c5\uc73c\ub85c\uc368, \ucc3d\uc5c5 7\ub144 \ubbf8\ub9cc\uc778 \uae30\uc5c5</h5><h5>\ubd84\uc57c : IoT, \ube45\ub370\uc774\ud130, \ud540\ud14c\ud06c, \ud074\ub77c\uc6b0\ub4dc, SNS \uc11c\ube44\uc2a4 \ub4f1 \uc804 \ubd84\uc57c\uc758 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc81c\ud488</h5><h5>\uc9c0\uc6d0\ub0b4\uc6a9</h5><ul class="con_ul"><li>SW\ud504\ub85c\uc288\uba38\ub97c \ud1b5\ud574 \uae30\uc5c5\uc758 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c 1\uc8fc\uc77c\uac04 \uc9c1\uc811 \uc0ac\uc6a9\ud558\uace0 \ud3c9\uac00\ud55c \uacb0\uacfc\ub97c \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uae30\uc5c5\uc5d0 \uc81c\uacf5\ud569\ub2c8\ub2e4. SW\ud504\ub85c\uc288\uba38\ub294 \uc5ed\ud560\uacfc \uc790\uaca9\uc5d0 \ub530\ub77c \uc77c\ubc18 SW\ud504\ub85c\uc288\uba38\uc640 \uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub85c \uad6c\ubd84 \ub429\ub2c8\ub2e4.<ul><li>\uc77c\ubc18 SW\ud504\ub85c\uc288\uba38 : \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc758 \uc7a0\uc7ac\uc801 \uc0ac\uc6a9\uc790\ub77c\uace0 \ud560 \uc218 \uc788\ub294 \uc77c\ubc18\uc778\uc73c\ub85c, \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc0ac\uc6a9\ud574 \ubcf8 \ud6c4 \uac10\uc131\uc801\uc778 \ud488\uc9c8\ubd80\ud130 \uc2dc\uc7a5\uc131 \ub4f1 \uc0ac\uc6a9\uc790\ub97c \ud1b5\ud574 \uae30\uc5c5\uc774 \uc54c\uace0\uc790 \ud558\ub294 \ubd80\ubd84\uc5d0 \ub300\ud55c \uc218\uce58\uc801\uc778 \ud3c9\uac00 \ubc0f \uc758\uacac\uc744 \uc81c\uc2dc (\uc81c\ud488\ubcc4 30\uba85 \uc774\uc0c1 \ucc38\uc5ec)</li><li>\uc804\ubb38 SW\ud504\ub85c\uc288\uba38 : \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ud14c\uc2a4\ud305 \uacbd\ub825\uc744 \uac16\ucd98 \ud14c\uc2a4\ud2b8 \uc804\ubb38\uac00\ub85c\uc368, \uc77c\ubc18 SW\ud504\ub85c\uc288\uba38\uc758 \uc5ed\ud560\uacfc \ub354\ubd88\uc5b4 \uc804\ubb38\uc801\uc778 \ud14c\uc2a4\ud2b8\ub97c \ud1b5\ud574 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc758 \uacb0\ud568\uc744 \ub3c4\ucd9c (\uc81c\ud488\ubcc4 5\uba85 \ucc38\uc5ec)</li></ul></li><li>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ub294 2\ucc28\uc5d0 \uac78\uccd0 \uc9c0\uc6d0\ub429\ub2c8\ub2e4. 1\ucc28\ub294 \uc77c\ubc18\u2027\uc804\ubb38 SW\ud504\ub85c\uc288\uba38\uac00 \ubaa8\ub450 \ucc38\uc5ec\ud558\uc5ec \ud3c9\uac00\ub97c \uc218\ud589\ud558\uace0 1\ucc28 \ud3c9\uac00\uacb0\uacfc\ub97c \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \ubc18\uc601\ud558\uc5ec \uc218\uc815\u2027\uac1c\uc120\ud558\ub294 \uae30\uac04\uc744 \uac70\uce58\uac8c \ub429\ub2c8\ub2e4. \uc774\ud6c4 \uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub97c \ud1b5\ud574 2\ucc28 \ud3c9\uac00\uac00 \uc9c4\ud589\ub418\uba70, \uc218\uc815\u2027\uac1c\uc120\ud55c \uc0ac\ud56d\uc5d0 \ub300\ud55c \ud655\uc778 \ubc0f Side-effect\uc5d0 \ub300\ud55c \ud14c\uc2a4\ud2b8\ub97c \uc218\ud589\ud558\uac8c \ub429\ub2c8\ub2e4. </li></ul><p class="con_img"><img src="/images/contents02.gif" alt="\uc81c\ud488\uacbd\uc7c1\ub825 \ud655\ubcf4" /></p><h4>\uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc0ac\uc6a9\uc131(UI/UX) \uac1c\uc120 \uc9c0\uc6d0</h4><h5>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00 \uacb0\uacfc\ub97c \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \ubc18\uc601\ud558\uc5ec \uc218\uc815\u2027\uac1c\uc120\ud558\ub294\ub370 \uc5b4\ub824\uc6c0\uc744 \uacaa\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uae30\uc5c5\uc5d0\uac8c \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc0ac\uc6a9\uc131, \ud2b9\ud788 UI/UX \uce21\uba74\uc5d0\uc11c\uc758 \uc9c1\uc811\uc801\uc778 \uac1c\uc120\uc744 \uc9c0\uc6d0\ud569\ub2c8\ub2e4.</h5><h5>\ub300\uc0c1 : SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5 \ub300\uc0c1\uc73c\ub85c \uc120\uc815\ub418\uc5b4 \uc9c4\ud589 \uc911\uc778 \uae30\uc5c5 \uc911 \uc2e0\uccad\uc744 \ud1b5\ud574 \ub300\uc0c1 \uc120\uc815</h5><h5>\uc9c0\uc6d0\ub0b4\uc6a9</h5><ul class="con_ul"><li>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00 \uacb0\uacfc \ubc0f \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ubd84\uc11d\uc744 \ud1b5\ud574 UI/UX \ubb38\uc81c\uc810 \ubc0f \uac1c\uc120\uc810 \ub3c4\ucd9c</li><li>UI/UX \uac1c\uc120\uc744 \uc704\ud55c \ud504\ub85c\ud1a0\ud0c0\uc785 \uac1c\ubc1c \ubc0f \uc0ac\uc6a9\uc790 \ud3c9\uac00\ub97c \ud1b5\ud55c \ud504\ub85c\ud1a0\ud0c0\uc785 \uc120\uc815</li><li>\ud504\ub85c\ud1a0\ud0c0\uc785\uc744 \ub514\uc790\uc778\uc73c\ub85c \uac1c\ubc1c\ud558\uace0 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \uc801\uc6a9\ud560 \uc218 \uc788\ub3c4\ub85d \uac00\uc774\ub4dc\ub77c\uc778 \uc81c\uacf5</li></ul><h4>\ube44\uc988\ub2c8\uc2a4 \ub9c8\ucf00\ud305 \uc9c0\uc6d0</h4><h5>\uc18c\ud504\ud2b8\uc6e8\uc5b4 \ubc0f \uae30\uc220\uc744 \uac1d\uad00\uc801\uc774\uace0 \ud6a8\uacfc\uc801\uc73c\ub85c \ud45c\ud604\ud558\uc5ec \uc2dc\uc7a5 \ube44\uc988\ub2c8\uc2a4\uc5d0 \ud65c\uc6a9\ud560 \uc218 \uc788\ub3c4\ub85d \ud14c\ud06c\ub2c8\uceec \ub9c8\ucf00\ud305\uc744 \uc9c0\uc6d0 \ud569\ub2c8\ub2e4.</h5><ul class="con_ul"><li>\uc9c0\uc6d0\ub0b4\uc6a9 : \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ubc0f \uae30\uc220\uc744 \uac1d\uad00\uc801\uc774\uace0 \uc815\ud655\ud558\uace0 \ub9e4\ub825\uc801\uc73c\ub85c \ud45c\ud604\ud558\uae30 \uc704\ud55c \ud14c\ud06c\ub2c8\uceec \ub9c8\ucf00\ud305 \ucee8\uc124\ud305\uc744 \uc81c\uacf5, \uadf8 \uacb0\uacfc\ub97c \uc801\uc6a9\ud55c \ub9ac\ud50c\ub81b\uacfc \ub79c\ub529\ud398\uc774\uc9c0 \uc81c\uc791 \uc9c0\uc6d0</li></ul><h5>\uae00\ub85c\ubc8c \uc9c4\ucd9c\uc744 \uacc4\ud68d\ud558\uace0 \uc900\ube44\ud55c \uae30\uc5c5\uc758 \ud574\uc678 \uc9c4\ucd9c \uc9c0\uc6d0\uc744 \uc704\ud574 \ud574\uc678 \uc804\uc2dc\u2027\uc0c1\ub2f4 \ubc0f IR\uc744 \uc9c0\uc6d0\ud569\ub2c8\ub2e4.</h5><ul class="con_ul"><li>\uc9c0\uc6d0\ub0b4\uc6a9 : \ud574\uc678 \uc804\uc2dc\ud68c SW\ud504\ub85c\uc288\uba38 \uccb4\ud5d8\uad00 \uc6b4\uc601\uc744 \ud1b5\ud55c \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc804\uc2dc\u2027\uc0c1\ub2f4 \ubc0f IR \uc9c0\uc6d0s</li></ul><h5>\uad6d\ub0b4 \ud22c\uc790\uae30\uad00 \ubc0f \ud22c\uc790\uc790\uc640\uc758 \ub124\ud2b8\uc6cc\ud0b9 \ud615\uc131\uc744 \ud1b5\ud574 \ud22c\uc790 \ubc0f \ud611\ub825 \uad00\uacc4 \ud65c\uc131\ud654\ub97c \uc774\ub8e8\uace0\uc790 \uae30\uc5c5\u2027\ud22c\uc790\uc790 \ub124\ud2b8\uc6cc\ud0b9 \ud589\uc0ac\ub97c \uc9c0\uc6d0\ud569\ub2c8\ub2e4.</h5><ul class="con_ul"><li>\uc9c0\uc6d0\ub0b4\uc6a9 : \uad6d\ub0b4 \ud22c\uc790\uae30\uad00 \ubc0f \ud22c\uc790\uc790\uc5d0 \ub300\ud55c \uae30\uc5c5 IR \ubc0f \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc18c\uac1c\ud558\uace0, \ud611\ub825\uad00\uacc4\ub97c \ud615\uc131\ud558\uae30 \uc704\ud55c \ub124\ud2b8\uc6cc\ud0b9 \ud589\uc0ac \uac1c\ucd5c</li></ul>
\uc77c\ubc18\uc0ac\uc6a9\uc790\ud3c9\uac00\uc548\ub0b4=<div class="con_box">SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ub2e8\uc740 \uad6d\ub0b4 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uae30\uc5c5\uc758 \uc6b0\uc218\ud55c \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \ubbf8\ub9ac \uc0ac\uc6a9\ud574\ubcf4\uace0 \ud3c9\uac00\uc5d0 \ucc38\uc5ec\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc5ec\ub7ec\ubd84\uc774 \uc81c\uc2dc\ud55c \uc18c\uc911\ud55c \uc758\uacac\uc774 \uc2dc\uc7a5\uc5d0 \ucd9c\uc2dc\ub418\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \ubc18\uc601\ub418\ub294 \ubaa8\uc2b5\uc744 \ud1b5\ud574 \ub300\ud55c\ubbfc\uad6d \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ud488\uc9c8 \ud5a5\uc0c1 \ubc0f \ubc1c\uc804\uc5d0 \uc9c1\uc811 \ucc38\uc5ec\ud558\ub294 \uc790\ubd80\uc2ec\uc744 \ub290\uaef4\ubcf4\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.</div><h4>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ub2e8\uc740 \uc77c\ubc18 SW\ud504\ub85c\uc288\uba38\uc640 \uc804\ubb38 SW\ud504\ub85c\uc288\uba38\uac00 \uc788\uc2b5\ub2c8\ub2e4. </h4><h5>\uc77c\ubc18 SW\ud504\ub85c\uc288\uba38\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc9c1\uc811 \uc0ac\uc6a9\ud574 \ubcf4\uace0 \uc2e4\uc81c \uc0ac\uc6a9\uc790 \uc785\uc7a5\uc5d0\uc11c \ud3c9\uac00\ub97c \uc9c4\ud589\ud569\ub2c8\ub2e4. \ud3c9\uac00\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ubcc4\ub85c \uc81c\uc2dc\ub41c \ubb38\ud56d\uc5d0 \ubcc4\uc810\uc73c\ub85c \uc810\uc218\ub97c \ubd80\uc5ec\ud558\uace0 \uc758\uacac\uc744 \uc81c\uc2dc\ud558\uac8c \ub429\ub2c8\ub2e4. </h5><ul class="con_ul"><li>\uc77c\ubc18 SW\ud504\ub85c\uc288\uba38\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc0ac\uc6a9\ud558\ub294 \ubd84\uc774\ub77c\uba74 \ub204\uad6c\ub77c\ub3c4 \ucc38\uc5ec\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc0ac\uc6a9\ud558\ub294 \ud658\uacbd\uc740 PC, \uc2a4\ub9c8\ud2b8\ud3f0, \ud0dc\ube14\ub9bf PC \ub4f1 \uc5b4\ub5a0\ud55c \ud658\uacbd\uc774\ub77c\ub3c4 \ubb34\uad00\ud569\ub2c8\ub2e4. \uac01 SW\ud504\ub85c\uc288\uba38 \uac1c\uc778\uc5d0\uac8c \ub9de\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \ucc38\uc5ec\ud560 \uc218 \uc788\ub3c4\ub85d \uc801\uc808\ud55c \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \ubc30\uc815\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.</li></ul><h5>\uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ud14c\uc2a4\ud2b8 \uc804\ubb38\uac00\ub85c\uc11c, \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc0ac\uc6a9\ud558\uba74\uc11c \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uacb0\ud568 \ubc0f \uc7a5\uc560\ub97c \ub3c4\ucd9c\ud558\ub294 \uc804\ubb38\uc801\uc778 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ud14c\uc2a4\ud2b8\ub97c \uc218\ud589\ud558\uac8c \ub429\ub2c8\ub2e4. </h5><ul class="con_ul"><li>\uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uac1c\ubc1c\u2027\ud488\uc9c8 \uad00\ub828 \uacbd\ub825 3\ub144 \uc774\uc0c1\uc758 \uc804\ubb38\uac00\ub9cc\uc774 \ucc38\uc5ec\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub294 \ud604\uc9c1\uc5d0 \uc885\uc0ac\ud558\uc9c0 \uc54a\uc544\ub3c4 \uac00\ub2a5\ud569\ub2c8\ub2e4. \uacbd\ub825\ub2e8\uc808\uc790\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ud14c\uc2a4\ud2b8 \uc804\ubb38 \uad50\uc721\uc744 \uc81c\uacf5\ud574 \ub4dc\ub9ac\uba70, \uad50\uc721\uc744 \uc774\uc218\ud560 \uacbd\uc6b0 \uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub85c \ud65c\ub3d9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.</li></ul><h5>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ub294 1\uc8fc\uc77c\uac04 \uc9c4\ud589\ud569\ub2c8\ub2e4. \uc2dc\uac04\uacfc \uc7a5\uc18c\uc5d0 \uad6c\uc560\ubc1b\uc9c0 \uc54a\uace0 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uc0ac\uc6a9\ud558\uace0 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc5d0 \ucc38\uc5ec\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \ubaa8\ub4e0 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00 \ud65c\ub3d9\uc740 \ubcf8 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5 \ud648\ud398\uc774\uc9c0\ub97c \ud1b5\ud574 \uc628\ub77c\uc778\uc73c\ub85c \uc9c4\ud589\ub429\ub2c8\ub2e4. </h5><p class="con_img"><img src="/images/contents04.gif" alt="\ud3c9\uac00\ub2e8 \ud3c9\uac00 \uc21c\uc11c:sw\ud504\ub85c\uc288\uba38\ub4f1\ub85d(\ud68c\uc6d0\uac00\uc785), sw\ud504\ub85c\uc288\uba38\ud3c9\uac00\ucc38\uc5ec\ub4f1\ub85d(\ud3c9\uac00\uacf5\uace0),sw\ud504\ub85c\uc288\uba38\ud3c9\uac00\uc81c\ud488\ubc30\uc815\ud655\uc778,\ub300\uc0c1\uc18c\ud504\ud2b8\uc6e8\uc5b4\ub2e4\uc6b4\ub85c\ub4dc\uc124\uce58,\uc18c\ud504\ud2b8\uc6e8\uc5b4\uc0ac\uc6a9,sw\ud504\ub85c\uc288\uba38\ud3c9\uac00\uacb0\uacfc\ubc0f\uc758\uacac\ub4f1\ub85d,sw\ud504\ub85c\uc288\uba38\ud3c9\uac00\uacb0\uacfc\uc81c\ucd9c" /></p><h5>SW\ud504\ub85c\uc288\uba38 \ub4f1\ub85d\uc740 \uc0c1\uc2dc \uac00\ub2a5\ud569\ub2c8\ub2e4. \ub2e4\ub9cc, SW\ud504\ub85c\uc288\uba38 \ub4f1\ub85d \ud6c4 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ucc38\uc5ec \uacf5\uace0\ub97c \ud1b5\ud574 \ud574\ub2f9 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc5d0 \ud3c9\uac00 \ucc38\uc5ec\ub97c \ub4f1\ub85d\ud574\uc57c SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc5d0 \ucc38\uc5ec \uac00\ub2a5\ud569\ub2c8\ub2e4.</h5><ul class="con_ul"><li>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ucc38\uc5ec \uacf5\uace0\ub294 4\uc6d4~5\uc6d4\uc5d0 \uc9c4\ud589\ub420 \uc608\uc815\uc785\ub2c8\ub2e4.</li></ul><h5>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc5d0 \ucc38\uc5ec\ud55c \uc77c\ubc18 SW\ud504\ub85c\uc288\uba38\uc5d0\uac8c\ub294 \uc18c\uc815\uc758 \ucc38\uc5ec \uc0c1\ud488\uc774 \uc81c\uacf5\ub418\uba70, \uc18c\ud504\ud2b8\uc6e8\uc5b4 \ubcc4\ub85c \uc801\uadf9\uc801\uc73c\ub85c \ucc38\uc5ec\ud55c \uc6b0\uc218 SW\ud504\ub85c\uc288\uba38\ub97c \uc120\ubc1c\ud558\uc5ec \ucd94\uac00\uc801\uc778 \ud3ec\uc0c1 \ub4dc\ub9bd\ub2c8\ub2e4. \ub610\ud55c, \uc804\ubb38 SW\ud504\ub85c\uc288\uba38\ub294 \uc77c\uc815\uc561\uc758 \ud14c\uc2a4\ud2b8 \uc218\ub2f9\uc774 \uc9c0\uae09\ub429\ub2c8\ub2e4.</h5><ul class="con_ul"><li>\ud3ec\uc0c1 \ubc0f \ud14c\uc2a4\ud2b8 \uc218\ub2f9\uc5d0 \ub300\ud574\uc11c\ub294 \ub2f9\ud574 \uc5f0\ub3c4 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\ub2e8 \ubaa8\uc9d1 \uacf5\uace0\ub97c \ucc38\uace0 \ubc14\ub78d\ub2c8\ub2e4.</li></ul>
\ub300\uc0c1\uae30\uc5c5\ud3c9\uac00\uc548\ub0b4=<div class="con_box">\uad6d\ub0b4 \uc911\uc18c\u2027\ucc3d\uc5c5 \uae30\uc5c5\uc758 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc81c\ud488\uc774 \uc2dc\uc7a5\uc5d0 \uc548\ucc29\ud560 \uc218 \uc788\ub3c4\ub85d \ud558\uace0\uc790 \uc2dc\ud589\ud558\uace0 \uc788\ub294 &quot;SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5&quot;\uc740 \uc6b0\uc218\ud55c \uae30\uc220\ub825\uacfc \ub3c5\ucc3d\uc801\uc778 \uc544\uc774\ub514\uc5b4\ub97c \uac00\uc9c4 \uc18c\ud504\ud2b8\uc6e8\uc5b4\uc5d0 \ub300\ud574 \uc0ac\uc6a9\uc790\ub97c \ud1b5\ud55c \ud3c9\uac00\ub97c \uc0ac\uc804\uc5d0 \uc81c\uacf5\ud558\uc5ec \uc0ac\uc6a9\uc790\uac00 \ub9cc\uc871\ud558\ub294 \uc18c\ud504\ud2b8\uc6e8\uc5b4\ub97c \uac1c\ubc1c\u2027\ucd9c\uc2dc \ud560 \uc218 \uc788\ub3c4\ub85d \uc9c0\uc6d0\ud569\ub2c8\ub2e4.</div><h5>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5\uc740 \ubaa8\uc9d1 \uacf5\uace0\ub97c \ud1b5\ud574 \uc2e0\uccad\u2027\uc811\uc218\ub97c \uc9c4\ud589\ud558\uba70, \uc120\uc815\uc704\uc6d0\ud68c\uc5d0 \uc758\ud55c \uac1d\uad00\uc801\uc778 \ud3c9\uac00\ub97c \ud1b5\ud574 \ub300\uc0c1\uc744 \uc120\uc815\ud558\uac8c \ub429\ub2c8\ub2e4.</h5><ul class="con_ul">	<li>\ub300\uc0c1 : \uad6d\ub0b4 \uc911\uc18c\u2027\ucc3d\uc5c5 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uae30\uc5c5\uc73c\ub85c\uc368, \ucc3d\uc5c5 7\ub144 \ubbf8\ub9cc\uc778 \uae30\uc5c5</li>	<li>\ubd84\uc57c : IoT, \ube45\ub370\uc774\ud130, \ud540\ud14c\ud06c, \ud074\ub77c\uc6b0\ub4dc, SNS \uc11c\ube44\uc2a4 \ub4f1 \uc804 \ubd84\uc57c\uc758 \uc18c\ud504\ud2b8\uc6e8\uc5b4 \uc81c\ud488</li></ul><p class="con_img"><img src="/images/contents03.gif" alt="\ub300\uc0c1\uae30\uc5c5 \uc548\ub0b4\uc21c\uc11c:\ubaa8\uc9d1\uacf5\uace0,\uc2e0\uccad\uc811\uc218,\uc120\uc815\ud3c9\uac00,\uc120\uc815\ud1b5\ubcf4\ubc0f\uc624\ub9ac\uc5d4\ud14c\uc774\uc158,\uc18c\ud504\ud2b8\uc6e8\uc5b4\ubd84\uc11d,\ud3c9\uac00\uc124\uacc4,\ud3c9\uac00\ub2e8\ubc30\uc815,\ud3c9\uac00\ub2e8\uc624\ub9ac\uc5d4\ud14c\uc774\uc158,1\ucc28\ud3c9\uac00\uc218\ud589,1\ucc28\ud3c9\uac00\uacb0\uacfc\uc804\ub2ec,\uc18c\ud504\ud2b8\uc6e8\uc5b4\uc218\uc815\uac1c\uc120,2\ucc28\ud3c9\uac00\uc124\uacc4,\ud3c9\uac00\ub2e8\ubc30\uc815,2\ucc28\ud3c9\uac00\uc218\ud589,\ucd5c\uc885\uacb0\uacfc\uc804\ub2ec" /></p><h5>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \ub300\uc0c1\uc73c\ub85c \uc120\uc815\ub41c \uae30\uc5c5\uc740 \ub2f9\ud574 \uc5f0\ub3c4 \uc0ac\uc5c5\uae30\uac04 \ub3d9\uc548 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0\uc744 \ubc1b\uac8c \ub418\uba70, SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc678\uc5d0 \ucd94\uac00\ub85c \uc9c0\uc6d0\ub418\ub294 \ud6c4\uc18d\uc9c0\uc6d0\uc5d0 \ucc38\uc5ec\ud560 \uc218 \uc788\ub294 \uae30\ud68c\uac00 \uc8fc\uc5b4\uc9d1\ub2c8\ub2e4.</h5><ul class="con_ul">	<li>\uc790\uc138\ud55c SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5 \ub0b4\uc6a9\uc740 <a href="">\u2018\uc0ac\uc5c5\uc548\ub0b4\u2019</a> \ucc38\uc870</li></ul><h5>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \ub300\uc0c1 \uae30\uc5c5 \ubaa8\uc9d1 \uacf5\uace0\ub294 3\uc6d4~4\uc6d4\uc5d0 \uc9c4\ud589\ub418\uba70, SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5 \ud648\ud398\uc774\uc9c0<a href="http://www.swprosumer.kr" target="_blank">(www.swprosumer.kr)</a>, \uc18c\ud504\ud2b8\uc6e8\uc5b4\uacf5\ud559\uc13c\ud130<a href="http://www.sw-eng.kr" target="_blank">(www.sw-eng.kr)</a>, SW\uc790\uc0b0\ubc45\ud06c<a href="http://www.swbank.kr" target="_blank">(www.swbank.kr)</a>\uc640 \uac01\uc885 \uc720\uad00\uae30\uad00 \ud648\ud398\uc774\uc9c0 \ubc0f \uad00\ub828 \ucee4\ubba4\ub2c8\ud2f0 \ub4f1\uc744 \ud1b5\ud574 \uacf5\uace0\ub429\ub2c8\ub2e4. \uc811\uc218\ub294 SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0 \uc0ac\uc5c5 \ud648\ud398\uc774\uc9c0\ub97c \ud1b5\ud574 \uc9c4\ud589\ub418\ub2c8, \ub9ce\uc740 \uad00\uc2ec\uacfc \ucc38\uc5ec \ubc14\ub78d\ub2c8\ub2e4.</h5><ul class="con_ul">	<li>SW\ud504\ub85c\uc288\uba38 \ud3c9\uac00\uc9c0\uc6d0\uc5d0 \ub300\ud55c \uc804\uccb4\uc801\uc778 \uc77c\uc815\uc740 \ub2f9\ud574 \uc5f0\ub3c4 \uc0ac\uc5c5 \uacf5\uace0\ub97c \ud1b5\ud574 \uacf5\uc9c0\ub418\ubbc0\ub85c, \uc0ac\uc5c5\uacf5\uace0\ub97c \ucc38\uace0\ud558\uc2dc\uae30 \ubc14\ub78d\ub2c8\ub2e4.</li></ul>


# [AX Lab] 신규 파일 (2026-10-06 AX Lab): AS 통합화면 AI 추천 — 추천 API 접속 설정
#
# 읽는 곳: egovframework.com.comm.util.CombineAsAiClient
# 우선순위: JVM 시스템 프로퍼티(-Dcombine.ai.url=…) > 환경변수(COMBINE_AI_URL / COMBINE_AI_KEY …) > 이 파일
#
# ★ 운영(AWS 챗봇 서버 배포 후) 값 — 설계서 §6
#    combine.ai.url=https://ai.cwit.co.kr/api/recommend
#    combine.ai.key=<서버 전용 키 — 이 파일에 평문으로 두지 말고 -D 또는 환경변수로 주입할 것>
#
# ★ 지금 값은 로컬 모의 서버(analysis/combine_recommend_server.py, 기본 포트 8765) 기준이다.
#    AWS 이관 전까지 CRM 개발 PC 에서 모의 서버를 띄워 동작을 확인하기 위한 설정이다.
combine.ai.url=http://127.0.0.1:8765/api/recommend
combine.ai.key=dev-key

# 밀리초. 설계서 §6 실패 처리: 2.5초 초과면 result != 000 으로 조용히 실패한다.
combine.ai.connectTimeoutMs=1000
combine.ai.readTimeoutMs=2500

# 'N' 이면 호출 자체를 하지 않고 즉시 result=901(비활성) 을 돌려준다. 장애 시 운영 중 끄는 스위치.
combine.ai.enabled=Y

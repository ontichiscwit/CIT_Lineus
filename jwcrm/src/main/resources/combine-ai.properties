# [AX Lab] 신규 파일 (2026-10-06 AX Lab): AS 통합화면 AI 추천 — 추천 API 접속 설정
#
# 읽는 곳: egovframework.com.comm.util.CombineAsAiClient
# 우선순위: JVM 시스템 프로퍼티(-Dcombine.ai.url=…) > 환경변수(COMBINE_AI_URL / COMBINE_AI_KEY …) > 이 파일
#
# ★ 운영(AWS 챗봇 서버 배포 후) 값 — 설계서 §6
#    combine.ai.url=https://ai.cwit.co.kr/api/recommend
#    combine.ai.key=<서버 전용 키 — 이 파일에 평문으로 두지 말고 -D 또는 환경변수로 주입할 것>
#
# ★ 지금 값은 CRM 과 같은 PC 에 띄우는 추천 서버 기준이다 — 저장소 루트 combine-ai-server/run.bat 로 기동 (README.md 참조).
#    서버가 안 떠 있으면 화면에 "AI 추천 서버 응답이 지연되어 건너뛰었습니다 [다시 시도]"(903) 가 뜨고 나머지 화면은 정상이다.
#    AWS 이관 전까지는 CRM 을 돌리는 PC/서버마다 이 추천 서버도 함께 떠 있어야 한다.
combine.ai.url=http://127.0.0.1:8765/api/recommend
combine.ai.key=dev-key

# 밀리초. 설계서 §6 실패 처리: 2.5초 초과면 result != 000 으로 조용히 실패한다.
combine.ai.connectTimeoutMs=1000
combine.ai.readTimeoutMs=2500

# 'N' 이면 호출 자체를 하지 않고 즉시 result=901(비활성) 을 돌려준다. 장애 시 운영 중 끄는 스위치.
combine.ai.enabled=Y

# [AX Lab] 수정 시작 (2026-10-19 AX Lab): AI 문장 다듬기 (고객 답변 작성영역 [AI 문장 다듬기] → POST /api/polish)
#   같은 추천 서버(combine_recommend_server.py)의 다른 경로다. 비우면 combine.ai.url 의 /api/recommend 를 /api/polish 로 바꿔 쓴다.
#   LLM 생성은 추천(2.5초)보다 오래 걸리므로 읽기 타임아웃을 따로 둔다. 실측(gemma4:26b, M3 Ultra): 200자 기준 1.3~2.5초.
#   추천 서버 쪽 COMBINE_POLISH_TIMEOUT_MS(기본 20초) 보다 커야 서버가 먼저 503 으로 답할 수 있다.
#   실패(result != 000) 하면 화면은 브라우저 안의 기본 문장 정리 규칙(caws_aiPolishLocal)으로 조용히 대체한다.
combine.ai.polish.url=
combine.ai.polish.enabled=Y
combine.ai.polish.connectTimeoutMs=1000
combine.ai.polish.readTimeoutMs=25000
# [AX Lab] 수정 끝

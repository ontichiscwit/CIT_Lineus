# [AX Lab] 첨부파일 원격 폴백 설정 (2026-10-08 AX Lab)  — CombineAttachFallback.java 가 읽는다.
#
# 용도 : 복제 DB(NEWCIT) 를 쓰는 로컬/개발 PC 에는 첨부 물리파일(C:\upload\...)이 없다.
#        /comm/fileDown.do 에서 로컬 파일이 없으면 아래 운영 웹서버의 /upload/** 정적 경로에서 받아 그대로 전달한다.
# 우선순위: JVM 시스템 프로퍼티(-Dcombine.attach.fallback.url=…) > 환경변수(COMBINE_ATTACH_FALLBACK_URL …) > 이 파일
#
# 기본값은 enabled=N (운영 서버는 파일이 항상 로컬 디스크에 있으므로 폴백이 필요 없다. 운영 WAR 는 아무 설정 없이 비활성.)
# 로컬 개발(mvn tomcat7:run)은 jwcrm/pom.xml 의 tomcat7-maven-plugin systemProperties 에서
#   combine.attach.fallback.enabled=Y 를 JVM 시스템 프로퍼티로 넘겨 자동으로 켜진다.
# (다른 WAS 로 로컬 기동하는 경우는 -Dcombine.attach.fallback.enabled=Y 를 직접 준다.)

# 운영 웹서버 기본 URL (끝에 / 없이). 비우면 폴백 비활성.
combine.attach.fallback.url=https://lineusadmin.cwit.co.kr

# Y/N  (기본 N: 운영 안전값. 로컬은 pom.xml systemProperties 로 Y 주입)
combine.attach.fallback.enabled=N

# 원격 연결/읽기 타임아웃(ms). 큰 첨부(수십 MB)도 받을 수 있게 읽기 타임아웃은 넉넉히.
combine.attach.fallback.connectTimeoutMs=3000
combine.attach.fallback.readTimeoutMs=60000
